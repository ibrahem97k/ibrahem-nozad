<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ibo TV</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #061a36;
      color: white;
    }

    header {
      background: #0878e8;
      padding: 20px;
      text-align: center;
      box-shadow: 0 3px 15px #0008;
    }

    header h1 {
      font-size: 32px;
    }

    header p {
      margin-top: 7px;
      color: #dceeff;
    }

    .container {
      width: 94%;
      max-width: 1100px;
      margin: 25px auto;
    }

    .channels {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
    }

    .channel {
      background: #0b2b55;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 20px #0006;
      transition: .2s;
    }

    .channel:hover {
      transform: translateY(-4px);
    }

    .channel video {
      width: 100%;
      height: 150px;
      background: black;
      display: block;
    }

    .channel-content {
      padding: 15px;
    }

    .channel h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .watch {
      width: 100%;
      padding: 11px;
      border: 0;
      border-radius: 8px;
      background: #0878e8;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    .watch:hover {
      background: #0561bc;
    }

    .login-box {
      background: #0b2b55;
      max-width: 400px;
      margin: 30px auto;
      padding: 25px;
      border-radius: 15px;
      display: none;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 0;
      border-radius: 8px;
    }

    button {
      cursor: pointer;
    }

    .login-btn,
    .admin-btn {
      width: 100%;
      padding: 12px;
      border: 0;
      border-radius: 8px;
      background: #0878e8;
      color: white;
      font-size: 16px;
      margin-top: 8px;
    }

    .admin {
      display: none;
      background: #0b2b55;
      padding: 20px;
      border-radius: 15px;
      margin-top: 25px;
    }

    .admin h2 {
      margin-bottom: 15px;
    }

    .add-btn {
      background: #00a86b;
      color: white;
      border: 0;
      padding: 12px 20px;
      border-radius: 8px;
      margin-top: 10px;
    }

    footer {
      margin-top: 40px;
      padding: 25px;
      text-align: center;
      background: #041226;
      color: #c9ddf5;
    }

    .social {
      margin-top: 10px;
      line-height: 2;
    }
  </style>
</head>

<body>

<header>
  <h1>📺 ibo TV</h1>
  <p>بەخێربێیت بۆ ibo TV</p>
</header>

<div class="container">

  <div class="channels" id="channels">

    <!-- کەنالی نموونە -->
    <div class="channel">
      <video controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      </video>

      <div class="channel-content">
        <h2>کەنالی تاقیکردنەوە</h2>
        <p>پەخشی ڤیدیۆ</p>
        <button class="watch" onclick="watchChannel()">
          ▶️ سەیرکردن
        </button>
      </div>
    </div>

  </div>

  <!-- Login -->
  <div class="login-box" id="loginBox">
    <h2>🔐 چوونەژوورەوەی Admin</h2>

    <input
      type="text"
      id="username"
      placeholder="Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button class="login-btn" onclick="login()">
      چوونەژوورەوە
    </button>

    <p id="loginMessage"></p>
  </div>

  <!-- Admin Panel -->
  <div class="admin" id="adminPanel">

    <h2>⚙️ Admin Panel - ibo TV</h2>

    <p>👥 بینەری ئێستا: <b id="viewers">0</b></p>

    <hr><br>

    <h3>➕ زیادکردنی کەنال</h3>

    <input
      type="text"
      id="channelName"
      placeholder="ناوی کەنال"
    >

    <input
      type="text"
      id="videoUrl"
      placeholder="لینکی ڤیدیۆ / MP4 / M3U8"
    >

    <button class="add-btn" onclick="addChannel()">
      زیادکردنی کەنال
    </button>

  </div>

</div>

<footer>

  <div>📞 07701056497</div>

  <div class="social">
    👻 Snapchat: ibrahemn.qader
  </div>

  <p style="margin-top:15px;">
    © 2026 ibo TV
  </p>

</footer>

<script>

  // Login - تەنها بۆ تاقیکردنەوە
  const ADMIN_USERNAME = "ibrahem97k";
  const ADMIN_PASSWORD = "IBib1997";

  let viewers = 0;

  function openLogin() {
    document.getElementById("loginBox").style.display = "block";
  }

  function login() {

    const username =
      document.getElementById("username").value;

    const password =
      document.getElementById("password").value;

    if (
      username === ADMIN_USERNAME &&
      password === ADMIN_PASSWORD
    ) {

      document.getElementById("loginBox").style.display = "none";

      document.getElementById("adminPanel").style.display = "block";

      alert("بەخێربێیت بۆ Admin Panel");

    } else {

      document.getElementById("loginMessage").innerText =
        "❌ Username یان Password هەڵەیە";

    }
  }

  function watchChannel() {

    viewers++;

    document.getElementById("viewers").innerText =
      viewers;
  }

  function addChannel() {

    const name =
      document.getElementById("channelName").value;

    const url =
      document.getElementById("videoUrl").value;

    if (!name || !url) {
      alert("تکایە ناوی کەنال و لینک بنووسە");
      return;
    }

    const channel =
      document.createElement("div");

    channel.className = "channel";

    channel.innerHTML = `
      <video controls>
        <source src="${url}">
      </video>

      <div class="channel-content">
        <h2>${name}</h2>

        <p>پەخشی ڤیدیۆ</p>

        <button class="watch"
          onclick="watchChannel()">
          ▶️ سەیرکردن
        </button>
      </div>
    `;

    document
      .getElementById("channels")
      .appendChild(channel);

    document.getElementById("channelName").value = "";
    document.getElementById("videoUrl").value = "";

    alert("✅ کەنال زیادکرا");
  }

  // بۆ کردنەوەی Login
  const adminLink = document.createElement("button");

  adminLink.innerText = "🔐 Admin";

  adminLink.style.cssText =
    "position:fixed;bottom:15px;left:15px;" +
    "padding:10px 15px;border:0;border-radius:8px;" +
    "background:#0878e8;color:white;z-index:9999;";

  adminLink.onclick = openLogin;

  document.body.appendChild(adminLink);

</script>

</body>
</html>
