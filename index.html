
<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kurd Games Live</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: white;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #111820;
      border-bottom: 1px solid #26313d;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      color: #aeb8c2;
    }

    .container {
      width: 95%;
      max-width: 1000px;
      margin: 25px auto;
    }

    .live {
      background: #151d26;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 25px;
    }

    .live h2 {
      margin-top: 0;
    }

    .video {
      position: relative;
      width: 100%;
      padding-bottom: 56.25%;
      height: 0;
      overflow: hidden;
      border-radius: 12px;
      background: black;
    }

    .video iframe {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 0;
      left: 0;
      top: 0;
    }

    .games {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .game {
      background: #151d26;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }

    .game h3 {
      margin-top: 0;
    }

    .button {
      display: inline-block;
      padding: 10px 18px;
      background: #e53935;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #8d99a5;
    }
  </style>
</head>

<body>

<header>
  <h1>🎮 Kurd Games Live</h1>
  <p>پەخشی یارییەکان بە ڕاستەوخۆ</p>
</header>

<div class="container">

  <section class="live">
    <h2>🔴 پەخشی ڕاستەوخۆ</h2>

      <iframe
        src="https://www.youtube.com/embed/live
