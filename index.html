<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IBO TV - Afarin Kids</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #050505;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 80px;
      background: #0066ff;
      display: flex;
      align-items: center;
      padding: 0 20px;
      gap: 15px;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .menu {
      font-size: 30px;
    }

    .container {
      width: 95%;
      max-width: 1000px;
      margin: 20px auto;
    }

    .player {
      background: #000;
      border: 3px solid #0066ff;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .channel-title {
      margin-top: 15px;
      padding: 18px;
      background: #101010;
      border: 2px solid #0066ff;
      border-radius: 12px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
    }

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    button {
      background: #0066ff;
      color: white;
      border: 0;
      border-radius: 10px;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #004dcc;
    }

    .channels {
      margin-top: 25px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .channel {
      background: #111;
      border: 1px solid #0066ff;
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
    }

    .channel:hover {
      background: #0066ff;
    }

    footer {
      margin-top: 30px;
      padding: 20px;
      text-align: center;
      background: #0066ff;
    }

    @media (max-width: 600px) {
      .channels {
        grid-template-columns: 1fr;
      }

      .channel-title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="menu">☰</div>
  <div class="logo">IBO TV</div>
</header>

<div class="container">

  <div class="player">
    <iframe
      src="https://karwan.tv/embed/109/"
      allowfullscreen
      allow="autoplay; fullscreen">
    </iframe>
  </div>

  <div class="channel-title">
    📺 Afarin Kids LIVE
  </div>

  <div class="buttons">
    <button onclick="fullscreenPlayer()">⛶ Full Screen</button>
    <button onclick="reloadPlayer()">🔄 نوێکردنەوە</button>
  </div>

  <div class="channels">

    <div class="channel" onclick="changeChannel('https://karwan.tv/embed/109/')">
      📺 Afarin Kids
    </div>

    <div class="channel">
      📺 کەنال 2
    </div>

    <div class="channel">
      📺 کەنال 3
    </div>

    <div class="channel">
      📺 کەنال 4
    </div>

    <div class="channel">
      📺 کەنال 5
    </div>

    <div class="channel">
      📺 کەنال 6
    </div>

    <div class="channel">
      📺 کەنال 7
    </div>

    <div class="channel">
      📺 کەنال 8
    </div>

    <div class="channel">
      📺 کەنال 9
    </div>

    <div class="channel">
      📺 کەنال 10
    </div>

    <div class="channel">
      📺 کەنال 11
    </div>

    <div class="channel">
      📺 کەنال 12
    </div>

    <div class="channel">
      📺 کەنال 13
    </div>

    <div class="channel">
      📺 کەنال 14
    </div>

  </div>

</div>

<footer>
  © 2026 IBO TV
</footer>

<script>
  function changeChannel(url) {
    document.querySelector("iframe").src = url;
  }

  function reloadPlayer() {
    const iframe = document.querySelector("iframe");
    iframe.src = iframe.src;
  }

  function fullscreenPlayer() {
    const iframe = document.querySelector("iframe");

    if (iframe.requestFullscreen) {
      iframe.requestFullscreen();
    }
  }
</script>

</body>
</html>
