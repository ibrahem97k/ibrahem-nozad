<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ibo TV 📺</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:#061b36;
    color:white;
}

/* HEADER */
header{
    background:#1680e8;
    text-align:center;
    padding:28px 10px 25px;
}

header h1{
    margin:0;
    font-size:45px;
}

header p{
    margin:12px 0 0;
    font-size:22px;
}

/* CHANNEL MENU */
.channel-menu{
    background:#09294e;
    padding:12px;
    display:flex;
    gap:8px;
    overflow-x:auto;
    position:sticky;
    top:0;
    z-index:10;
}

.channel-menu button{
    border:0;
    border-radius:12px;
    background:#1680e8;
    color:white;
    padding:12px 17px;
    font-size:16px;
    white-space:nowrap;
    cursor:pointer;
}

.channel-menu button.active{
    background:white;
    color:#0872d8;
}

/* CONTENT */
main{
    max-width:900px;
    margin:auto;
    padding:22px;
}

.card{
    background:#0d315a;
    border-radius:22px;
    padding:16px;
    margin-bottom:20px;
    box-shadow:0 8px 25px #0005;
}

video,
.card img{
    width:100%;
    max-height:520px;
    object-fit:contain;
    border-radius:16px;
    background:#000;
}

.channel-title{
    font-size:28px;
    margin:10px 0;
}

.channel-text{
    font-size:20px;
    line-height:1.9;
    white-space:pre-wrap;
}

/* FOOTER */
footer{
    background:#06162b;
    text-align:center;
    padding:45px 15px;
    font-size:20px;
    line-height:2.3;
}

/* ADMIN BUTTON */
.admin-button{
    position:fixed;
    left:20px;
    bottom:20px;
    z-index:20;
    border:0;
    border-radius:14px;
    background:#1680e8;
    color:white;
    padding:14px 20px;
    font-size:18px;
    cursor:pointer;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#000c;
    z-index:50;
    padding:20px;
    overflow:auto;
}

.admin-panel{
    max-width:700px;
    margin:20px auto;
    background:#0d315a;
    border-radius:20px;
    padding:20px;
}

.admin-panel h2{
    margin-top:0;
}

input,
textarea,
select{
    width:100%;
    padding:13px;
    margin:7px 0 12px;
    border:0;
    border-radius:10px;
    font-size:17px;
}

textarea{
    min-height:110px;
    resize:vertical;
}

.admin-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.admin-row button{
    border:0;
    border-radius:10px;
    padding:12px 17px;
    font-size:16px;
    cursor:pointer;
}

.save{
    background:#1680e8;
    color:white;
}

.close{
    background:#ddd;
    color:#111;
}

.delete{
    background:#d93636;
    color:white;
}

.info{
    background:#082544;
    border-radius:12px;
    padding:12px;
    margin-top:15px;
}
</style>
</head>

<body>

<!-- HEADER -->
<header>
    <h1>ibo TV 📺</h1>
    <p>بەخێربێیت بۆ ibo TV</p>
</header>

<!-- CHANNELS -->
<div class="channel-menu" id="channelMenu"></div>

<!-- CONTENT -->
<main id="content"></main>

<!-- FOOTER -->
<footer>
    07701056497 📞<br>
    Snapchat: ibrahemn.qader 👻<br>
    ibo TV 2026 ©
</footer>

<!-- ADMIN BUTTON -->
<button class="admin-button" onclick="openAdmin()">
    Admin 🔐
</button>

<!-- ADMIN WINDOW -->
<div class="modal" id="adminModal">

    <div class="admin-panel">

        <!-- LOGIN -->
        <div id="loginBox">

            <h2>Admin 🔐</h2>

            <p>
                بۆ دەستکاریکردنی Channel ـەکان
                password ـەکە بنووسە.
            </p>

            <input
                type="password"
                id="adminPassword"
                placeholder="Password"
            >

            <div class="admin-row">

                <button class="save" onclick="loginAdmin()">
                    چوونەژوورەوە
                </button>

                <button class="close" onclick="closeAdmin()">
                    داخستن
                </button>

            </div>

        </div>


        <!-- EDITOR -->
        <div id="editorBox" style="display:none;">

            <h2>بەڕێوەبردنی ibo TV 📺</h2>

            <label>
                Channel هەڵبژێرە:
            </label>

            <select id="channelSelect"></select>


            <label>
                ناوی Channel:
            </label>

            <input
                id="channelName"
                placeholder="Channel 1"
            >


            <label>
                تێکست:
            </label>

            <textarea
                id="channelText"
                placeholder="تێکستەکەت لێرە بنووسە..."
            ></textarea>


            <label>
                وێنە:
            </label>

            <input
                type="file"
                id="imageFile"
                accept="image/*"
            >


            <label>
                لینکى ڤیدیۆ:
            </label>

            <input
                id="videoUrl"
                placeholder="https://example.com/video.mp4"
            >


            <div class="admin-row">

                <button
                    class="save"
                    onclick="saveChannel()">
                    پاشەکەوتکردن 💾
                </button>

                <button
                    class="delete"
                    onclick="deleteChannel()">
                    سڕینەوە 🗑️
                </button>

                <button
                    class="close"
                    onclick="closeAdmin()">
                    داخستن
                </button>

            </div>

            <div class="info">
                تێبینی: دەتوانیت بۆ هەر Channel ناو، تێکست،
                وێنە و لینکی ڤیدیۆ دابنێیت.
            </div>

        </div>

    </div>
</div>


<script>

/*
=====================================
PASSWORD
=====================================

ئەمە بگۆڕە بۆ password ـی خۆت
*/

const ADMIN_PASSWORD = "CHANGE_ME";


/*
=====================================
CHANNEL DATA
=====================================
*/

const STORAGE_KEY = "ibo_tv_channels";


let defaultChannels = [];

for(let i = 1; i <= 14; i++){

    defaultChannels.push({

        name: "Channel " + i,

        text: "",

        image: "",

        video: ""

    });

}


/*
=====================================
LOAD DATA
=====================================
*/

let channels =
    JSON.parse(localStorage.getItem(STORAGE_KEY))
    || defaultChannels;


let currentChannel = 0;


/*
=====================================
SAVE DATA
=====================================
*/

function saveData(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(channels)
    );

}


/*
=====================================
CREATE CHANNEL BUTTONS
=====================================
*/

function renderChannels(){

    const menu =
        document.getElementById("channelMenu");

    menu.innerHTML = "";


    channels.forEach((channel,index)=>{

        const button =
            document.createElement("button");

        button.innerText =
            channel.name ||
            "Channel " + (index + 1);


        if(index === currentChannel){

            button.classList.add("active");

        }


        button.onclick = function(){

            currentChannel = index;

            renderChannels();

            renderContent();

        };


        menu.appendChild(button);

    });

}


/*
=====================================
SHOW CHANNEL
=====================================
*/

function renderContent(){

    const channel =
        channels[currentChannel];


    let media = "";


    /*
    VIDEO
    */

    if(channel.video){

        media = `
        <div class="card">

            <video
                controls
                playsinline
                src="${escapeHTML(channel.video)}">
            </video>

        </div>
        `;

    }


    /*
    IMAGE
    */

    else if(channel.image){

        media = `
        <div class="card">

            <img
                src="${channel.image}"
                alt="ibo TV">

        </div>
        `;

    }


    document.getElementById("content").innerHTML = `

        ${media}

        <div class="card">

            <h2 class="channel-title">
                ${escapeHTML(
                    channel.name ||
                    "Channel " + (currentChannel + 1)
                )}
            </h2>


            <div class="channel-text">

                ${
                    channel.text
                    ? escapeHTML(channel.text)
                    : "بەخێربێیت بۆ ئەم کەنالە 📺"
                }

            </div>

        </div>

    `;

}


/*
=====================================
ADMIN OPEN
=====================================
*/

function openAdmin(){

    document.getElementById(
        "adminModal"
    ).style.display = "block";


    document.getElementById(
        "loginBox"
    ).style.display = "block";


    document.getElementById(
        "editorBox"
    ).style.display = "none";


    document.getElementById(
        "adminPassword"
    ).value = "";

}


/*
=====================================
ADMIN CLOSE
=====================================
*/

function closeAdmin(){

    document.getElementById(
        "adminModal"
    ).style.display = "none";

}


/*
=====================================
ADMIN LOGIN
=====================================
*/

function loginAdmin(){

    const password =
        document.getElementById(
            "adminPassword"
        ).value;


    if(password === ADMIN_PASSWORD){

        document.getElementById(
            "loginBox"
        ).style.display = "none";


        document.getElementById(
            "editorBox"
        ).style.display = "block";


        createChannelSelect();

        loadEditor();

    }

    else{

        alert("Password هەڵەیە ❌");

    }

}


/*
=====================================
CHANNEL SELECT
=====================================
*/

function createChannelSelect(){

    const select =
        document.getElementById(
            "channelSelect"
        );


    select.innerHTML = "";


    channels.forEach((channel,index)=>{

        const option =
            document.createElement("option");


        option.value = index;


        option.innerText =
            channel.name ||
            "Channel " + (index + 1);


        select.appendChild(option);

    });


    select.value = currentChannel;


    select.onchange = function(){

        currentChannel =
            Number(this.value);


        loadEditor();

    };

}


/*
=====================================
LOAD EDITOR
=====================================
*/

function loadEditor(){

    const channel =
        channels[currentChannel];


    document.getElementById(
        "channelSelect"
    ).value = currentChannel;


    document.getElementById(
        "channelName"
    ).value =
        channel.name || "";


    document.getElementById(
        "channelText"
    ).value =
        channel.text || "";


    document.getElementById(
        "videoUrl"
    ).value =
        channel.video || "";


    document.getElementById(
        "imageFile"
    ).value = "";

}


/*
=====================================
SAVE CHANNEL
=====================================
*/

function saveChannel(){

    const channel =
        channels[currentChannel];


    channel.name =
        document.getElementById(
            "channelName"
        ).value.trim()
        ||
        "Channel " + (currentChannel + 1);


    channel.text =
        document.getElementById(
            "channelText"
        ).value;


    channel.video =
        document.getElementById(
            "videoUrl"
        ).value.trim();


    const file =
        document.getElementById(
            "imageFile"
        ).files[0];


    /*
    IMAGE
    */

    if(file){

        const reader =
            new FileReader();


        reader.onload = function(){

            channel.image =
                reader.result;


            saveData();


            renderChannels();

            renderContent();

            createChannelSelect();

            loadEditor();


            alert(
                "Channel بە سەرکەوتوویی پاشەکەوت کرا ✅"
            );

        };


        reader.readAsDataURL(file);

    }


    /*
    WITHOUT IMAGE
    */

    else{

        saveData();


        renderChannels();

        renderContent();

        createChannelSelect();

        loadEditor();


        alert(
            "Channel بە سەرکەوتوویی پاشەکەوت کرا ✅"
        );

    }

}


/*
=====================================
DELETE CHANNEL CONTENT
=====================================
*/

function deleteChannel(){

    const answer =
        confirm(
            "دڵنیایت دەتەوێت ناوەڕۆکی ئەم Channel ـە بسڕیتەوە؟"
        );


    if(!answer){

        return;

    }


    channels[currentChannel] = {

        name:
            "Channel " +
            (currentChannel + 1),

        text: "",

        image: "",

        video: ""

    };


    saveData();


    renderChannels();

    renderContent();

    createChannelSelect();

    loadEditor();


    alert(
        "ناوەڕۆکەکە سڕایەوە 🗑️"
    );

}


/*
=====================================
SECURITY / HTML TEXT
=====================================
*/

function escapeHTML(text){

    return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/*
=====================================
START
=====================================
*/

renderChannels();

renderContent();

</script>

</body>
</html>
