const ADMIN_UID="DNbVoT1LbyMy6oexnZxwEsAS1qH2";firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();let groups=[],sel=null,chan=null,isAdmin=false;const $=x=>document.getElementById(x),msg=(id,s)=>$(id).textContent=s;
function renderGroups(){let r=$("groups");r.innerHTML="";if(!groups.length){r.textContent="هێشتا کۆمەڵە نییە";return}groups.forEach(g=>{let b=document.createElement("button");b.textContent=g.name;b.className=g.id===sel?"active":"";b.onclick=()=>{sel=g.id;chan=null;renderGroups();renderChannels();$("title").textContent=g.name;$("desc").textContent="کەنالێک هەڵبژێرە";$("video").style.display=$("frame").style.display="none";$("empty").style.display="grid";$("empty").textContent="کەنالێک هەڵبژێرە"};r.append(b)})}

function manage(){let r=$("manage");r.innerHTML="";groups.forEach(g=>{let w=document.createElement("div");w.style.cssText="padding:10px;margin:10px;background:#09172b;border-radius:12px";let h=document.createElement("b");h.textContent=g.name;w.append(h);let ren=document.createElement("button");ren.textContent="گۆڕینی ناو";ren.className="btn secondary";ren.onclick=async()=>{let n=prompt("ناوی کۆمەڵە",g.name);if(n)await db.collection("groups").doc(g.id).update({name:n})};w.append(ren);let del=document.createElement("button");del.textContent="سڕینەوە";del.className="btn danger";del.onclick=async()=>{if(confirm("سڕینەوە؟"))await db.collection("groups").doc(g.id).delete()};w.append(del);(g.channels||[]).forEach(c=>{let line=document.createElement("div");line.style.cssText="border-top:1px solid #345;padding:8px";line.textContent=c.name+" ";let ed=document.createElement("button");ed.textContent="دەستکاری";ed.className="btn secondary";ed.onclick=async()=>{let n=prompt("ناو",c.name);if(n===null)return;let u=prompt("لینک",c.url);if(u===null)return;let d=prompt("زانیاری",c.description||"")||"";await db.collection("groups").doc(g.id).update({channels:g.channels.map(x=>x.id===c.id?{...x,name:n,url:u,description:d}:x)})};line.append(ed);let rm=document.createElement("button");rm.textContent="سڕینەوە";rm.className="btn danger";rm.onclick=async()=>{if(confirm("سڕینەوەی کەنال؟"))await db.collection("groups").doc(g.id).update({channels:g.channels.filter(x=>x.id!==c.id)})};line.append(rm);w.append(line)});r.append(w)})}

$("adasyncdGroup").onclick=()=>{let n=$("groupName").value.trim();if(!n)return msg("adminStatus","ناو بنووسە");try{let ref=await db.collection("groups").add({name:n,channels:[],createdAt:firebase.firestore.FieldValue.serverTimestamp()});sel=ref.id;$("groupName").value="";msg("adminStatus","زیادکرا")}catch(e){msg("adminStatus",e.message)}};
